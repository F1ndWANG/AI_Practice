[metadata]
name = ai-practice
version = 0.3.0
description = Reproducible agent exploration and multimodal post-training experiments
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
include =
    ai_practice*
    rsi_agent*
    vlm_posttraining*

[options.entry_points]
console_scripts =
    ai-practice = ai_practice.__main__:main

[options.extras_require]
browser =
    playwright>=1.48,<2
