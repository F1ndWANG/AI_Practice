name: CPU acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run and verify acceptance workflow
        shell: bash
        run: |
          ai-practice smoke runs/ci
          ai-practice verify runs/ci
      - name: Run both regression gates and verify bundle
        shell: bash
        run: |
          python -m ai_practice.acceptance_plan freeze runs/ci-plan.json \
            --agent-base runs/ci/agent --agent-candidate runs/ci/agent \
            --agent-policy examples/policies/agent.json \
            --vision-manifest runs/ci/fixtures/prepared/test.jsonl \
            --vision-base runs/ci/fixtures/fixture-repeated_answer.jsonl \
            --vision-candidate runs/ci/fixtures/fixture-oracle.jsonl \
            --vision-policy examples/policies/vision.json --revision "$GITHUB_SHA" --include-changes
          python -m ai_practice.acceptance_plan run runs/ci-plan.json runs/ci-acceptance
      - name: Upload acceptance bundle
        if: always() && hashFiles('runs/ci-acceptance/bundle/receipt.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-python-${{ matrix.python-version }}
          path: runs/ci-acceptance/bundle/
          if-no-files-found: error

  runtime-isolation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m pip install .
      - name: Verify actual namespace isolation and live HTTP state
        run: |
          python -m unittest discover -s tests -p test_runtime_sandbox.py -v
          python -m unittest discover -s tests -p test_runtime_integration.py -v

  runtime-completion:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser and container dependencies
        run: |
          python -m pip install '.[browser]'
          python -m playwright install --with-deps chromium
          docker build -t ai-practice-runtime:local -f examples/runtime.Dockerfile examples
      - name: Verify external effects, rendered DOM and calibrated memory
        run: python -m unittest discover -s tests -p test_runtime_completion.py -v
      - name: Verify actual container quotas and limited host mounts
        env:
          AGENT_DOCKER_TESTS: '1'
        run: python -m unittest discover -s tests -p test_runtime_docker.py -v
