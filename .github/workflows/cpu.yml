name: CPU acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run and verify acceptance workflow
        shell: bash
        run: |
          ai-practice smoke runs/ci
          ai-practice verify runs/ci
      - name: Run both regression gates and verify bundle
        shell: bash
        run: |
          python -m ai_practice.acceptance runs/ci-acceptance \
            --agent-base runs/ci/agent --agent-candidate runs/ci/agent \
            --agent-policy examples/policies/agent.json \
            --vision-manifest runs/ci/fixtures/prepared/test.jsonl \
            --vision-base runs/ci/fixtures/fixture-repeated_answer.jsonl \
            --vision-candidate runs/ci/fixtures/fixture-oracle.jsonl \
            --vision-policy examples/policies/vision.json --revision "$GITHUB_SHA" --include-changes
      - name: Upload acceptance bundle
        if: always() && hashFiles('runs/ci-acceptance/bundle/receipt.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-python-${{ matrix.python-version }}
          path: runs/ci-acceptance/bundle/
          if-no-files-found: error
